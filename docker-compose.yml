name: atoms-mini

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_MODEL_PM: ${LLM_MODEL_PM:-}
      LLM_MODEL_DEV: ${LLM_MODEL_DEV:-}
      LLM_MODEL_OPS: ${LLM_MODEL_OPS:-}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      # 配置 HTTPS 后放开
      # - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./deploy/certs:/etc/nginx/certs:ro
